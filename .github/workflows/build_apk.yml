name: Build Android APK Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Extract project from ZIP if present
        shell: bash
        run: |
          if [ -f "zerotoolsskin.zip" ]; then
            unzip -o zerotoolsskin.zip -d extracted
            shopt -s dotglob nullglob
            for item in extracted/*; do
              mv "$item" .
            done
            rm -rf extracted zerotoolsskin.zip
          fi

      - name: Auto Fix build.gradle, Layout, and Manifest Errors
        shell: bash
        run: |
          # 1. Mengubah shrinkResources true menjadi false agar sinkron
          GRADLE_PATH="app/build.gradle"
          if [ -f "$GRADLE_PATH" ]; then
            echo "Menonaktifkan shrinkResources..."
            sed -i 's/shrinkResources true/shrinkResources false/g' "$GRADLE_PATH"
          fi

          # 2. Membersihkan kesalahan manifest otomatis
          MANIFEST_PATH="app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            echo "Memperbaiki Manifest otomatis..."
            sed -i 's/package="com.zero.tools.skin"//g' "$MANIFEST_PATH"
            sed -i 's/theme="@style\/AppTheme.DebugActivity"/theme="@style\/AppTheme"/g' "$MANIFEST_PATH"
            sed -i '/<activity android:name="com.google.android.gms.ads.AdActivity"/,/.*\/>/d' "$MANIFEST_PATH"
          fi

          # 3. Membersihkan komponen gaib di main.xml layout secara paksa agar lolos AAPt
          LAYOUT_PATH="app/src/main/res/layout/main.xml"
          if [ -f "$LAYOUT_PATH" ]; then
            echo "Membersihkan error di main.xml secara otomatis..."
            # Mengganti tema overlay yang hilang ke tema bawaan Android standar
            sed -i 's/@style\/AppTheme.AppBarOverlay/@style\/ThemeOverlay.AppCompat.Dark.ActionBar/g' "$LAYOUT_PATH"
            sed -i 's/@style\/AppTheme.PopupOverlay/@style\/ThemeOverlay.AppCompat.Light/g' "$LAYOUT_PATH"
            
            # Menghapus baris atribut ilegal yang bikin AAPT mogok
            sed -i '/pointContainerLeftRightPadding/d' "$LAYOUT_PATH"
            sed -i '/isClipChildrenMode/d' "$LAYOUT_PATH"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Install Android SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.13
          fi
          chmod +x gradlew

      - name: Build Release APK with Obfuscation
        run: ./gradlew assembleRelease --no-daemon --refresh-dependencies

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Released-APK
          path: app/build/outputs/apk/release/*.apk
