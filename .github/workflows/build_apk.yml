name: Build Android APK Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Ekstrak Proyek dari ZIP
      run: |
        if [ -f "zerotoolsskin.zip" ]; then
          unzip zerotoolsskin.zip -d proyek_ekstrak
          mv proyek_ekstrak/* . 2>/dev/null || true
          mv proyek_ekstrak/.* . 2>/dev/null || true
          rm -rf proyek_ekstrak zerotoolsskin.zip
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 🚀 JALUR AMAN MURNI: Tautan diketik langsung di dalam perintah curl tanpa variabel env
    - name: Unduh dan Ekstrak Biner Gradle 8.2
      run: |
        curl -L -s -o gradle-8.2-bin.zip "https://gradle.org"
        unzip -q gradle-8.2-bin.zip
        rm -f gradle-8.2-bin.zip

    - name: Build Release APK dengan R8 Enkripsi
      run: |
        mkdir -p .gradle_home
        ./gradle-8.2/bin/gradle assembleRelease --no-daemon --gradle-user-home .gradle_home --refresh-dependencies

    - name: Unggah Hasil APK Aman ke GitHub
      uses: actions/upload-artifact@v4
      with:
        name: ZeroToolsSkin-Secure-APK
        path: |
          app/build/outputs/apk/release/*.apk
          **/build/outputs/apk/release/*.apk
        retention-days: 7
