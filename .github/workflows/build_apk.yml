name: Build Android APK Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Ekstrak Proyek dari ZIP
      run: |
        if [ -f "zerotoolsskin.zip" ]; then
          unzip zerotoolsskin.zip -d proyek_ekstrak
          mv proyek_ekstrak/* . 2>/dev/null || true
          mv proyek_ekstrak/.* . 2>/dev/null || true
          rm -rf proyek_ekstrak zerotoolsskin.zip
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 🚀 PERBAIKAN TOTAL: Alamat URL unduhan dikunci ke server services.gradle.org asli
    - name: Pasang Gradle Instan
      run: |
        wget -q https://gradle.org
        sudo unzip -q gradle-8.2-bin.zip -d /opt
        echo "/opt/gradle-8.2/bin" >> $GITHUB_PATH

    # 🛠️ JALANKAN BUILD: Menggunakan perintah gradle instan tanpa cache 'jars-9' yang korup
    - name: Build Release APK dengan R8 Enkripsi
      run: gradle assembleRelease --no-daemon --refresh-dependencies

    - name: Unggah Hasil APK Aman ke GitHub
      uses: actions/upload-artifact@v4
      with:
        name: ZeroToolsSkin-Secure-APK
        path: |
          app/build/outputs/apk/release/*.apk
          **/build/outputs/apk/release/*.apk
        retention-days: 7
