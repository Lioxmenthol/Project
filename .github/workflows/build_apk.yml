name: Build Android APK Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Ekstrak Proyek dari ZIP
      run: |
        if [ -f "zerotoolsskin.zip" ]; then
          unzip zerotoolsskin.zip -d proyek_ekstrak
          mv proyek_ekstrak/* . 2>/dev/null || true
          mv proyek_ekstrak/.* . 2>/dev/null || true
          rm -rf proyek_ekstrak zerotoolsskin.zip
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 🔒 SETUP GRADLE: Menggunakan versi 8.2 resmi tanpa menyimpan cache rusak sebelumnya
    - name: Setup Sistem Gradle 8.2
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.2
        cache-disabled: true

    # 🧹 LANGKAH FIX: Bersihkan cache korup bawaan server secara paksa sebelum membuat wrapper
    - name: Bersihkan Cache dan Buat Wrapper
      run: |
        rm -rf ~/.gradle/caches/
        rm -f gradlew gradlew.bat
        rm -rf gradle
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew

    - name: Build Release APK dengan R8 Enkripsi
      run: ./gradlew assembleRelease --no-daemon --refresh-dependencies
