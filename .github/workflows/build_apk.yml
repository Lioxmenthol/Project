name: Build Android APK Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Extract project from ZIP if present
        shell: bash
        run: |
          if [ -f "zerotoolsskin.zip" ]; then
            mkdir -p extracted
            unzip -o zerotoolsskin.zip -d extracted
            shopt -s dotglob nullglob
            for item in extracted/*; do
              mv -f "$item" .
            done
            rm -rf extracted zerotoolsskin.zip
          fi

      - name: Fix CI-only DebugActivity Theme Reference
        shell: bash
        run: |
          MANIFEST="app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ]; then
            sed -i \
              's/@style\/AppTheme\.DebugActivity/@style\/AppTheme/g' \
              "$MANIFEST"
          fi

      - name: Add Missing Resources for CI Build
        shell: bash
        run: |
          VALUES_DIR="app/src/main/res/values"
          mkdir -p "$VALUES_DIR"

          cat > "$VALUES_DIR/ci_workflow_resources.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme.AppBarOverlay" />
              <style name="AppTheme.PopupOverlay" />

              <attr name="pointContainerLeftRightPadding" format="dimension" />
              <attr name="isClipChildrenMode" format="boolean" />
          </resources>
          EOF

          echo "Resource sementara untuk CI telah dibuat."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.13
          fi
          chmod +x gradlew

      - name: Build Release APK with R8
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace
            --info

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Released-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
