name: Build Android APK Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Ekstrak Proyek dari ZIP
      run: |
        if [ -f "zerotoolsskin.zip" ]; then
          unzip zerotoolsskin.zip -d proyek_ekstrak
          mv proyek_ekstrak/* . 2>/dev/null || true
          mv proyek_ekstrak/.* . 2>/dev/null || true
          rm -rf proyek_ekstrak zerotoolsskin.zip
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 🚀 BYPASS TOTAL: Memasang Gradle 8.2 secara mandiri menggunakan SDKMAN! tanpa menyentuh cache 'gradle/actions'
    - name: Pasang Gradle via SDKMAN
      run: |
        curl -s "https://sdkman.io" | bash
        source "$HOME/.sdkman/bin/sdkman-init.sh"
        sdk install gradle 8.2
        echo "$HOME/.sdkman/candidates/gradle/current/bin" >> $GITHUB_PATH

    # 🛠️ EKSEKUSI BUILD: Menggunakan perintah 'gradle' sistem murni secara langsung
    - name: Build Release APK dengan R8 Enkripsi
      run: gradle assembleRelease --no-daemon --refresh-dependencies

    - name: Unggah Hasil APK Aman ke GitHub
      uses: actions/upload-artifact@v4
      with:
        name: ZeroToolsSkin-Secure-APK
        path: |
          app/build/outputs/apk/release/*.apk
          **/build/outputs/apk/release/*.apk
        retention-days: 7
