name: Build Android APK Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Ekstrak Proyek dari ZIP
      run: |
        if [ -f "zerotoolsskin.zip" ]; then
          unzip zerotoolsskin.zip -d proyek_ekstrak
          mv proyek_ekstrak/* . 2>/dev/null || true
          mv proyek_ekstrak/.* . 2>/dev/null || true
          rm -rf proyek_ekstrak zerotoolsskin.zip
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # KUNCI UTAMA: Memaksa server membuat Wrapper Gradle versi 8.5 murni
    - name: Buat Wrapper Gradle Aman
      run: |
        rm -f gradlew gradlew.bat
        rm -rf gradle
        gradle wrapper --gradle-version 8.5

    - name: Build Release APK dengan R8
      run: ./gradlew assembleRelease --no-daemon

    - name: Unggah Hasil APK Aman ke GitHub
      uses: actions/upload-artifact@v4
      with:
        name: ZeroToolsSkin-Secure-APK
        path: |
          app/build/outputs/apk/release/*.apk
          **/build/outputs/apk/release/*.apk
        retention-days: 7
