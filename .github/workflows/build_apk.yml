name: Build Android APK Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Extract project from ZIP if present
        shell: bash
        run: |
          if [ -f "zerotoolsskin.zip" ]; then
            mkdir -p extracted
            unzip -o zerotoolsskin.zip -d extracted
            shopt -s dotglob nullglob
            for item in extracted/*; do
              mv -f "$item" .
            done
            rm -rf extracted zerotoolsskin.zip
          fi

      - name: Fix CI-only DebugActivity Theme Reference
        shell: bash
        run: |
          MANIFEST="app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ]; then
            sed -i \
              's/@style\/AppTheme\.DebugActivity/@style\/AppTheme/g' \
              "$MANIFEST"
          fi

      - name: Add Missing Resources for CI Build
        shell: bash
        run: |
          VALUES_DIR="app/src/main/res/values"
          mkdir -p "$VALUES_DIR"

          cat > "$VALUES_DIR/ci_workflow_resources.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme.AppBarOverlay" />
              <style name="AppTheme.PopupOverlay" />

              <attr name="pointContainerLeftRightPadding" format="dimension" />
              <attr name="isClipChildrenMode" format="boolean" />
          </resources>
          EOF

          echo "Resource sementara untuk CI telah dibuat."
          
      - name: Inspect Local Libraries
        shell: bash
        run: |
          echo "=== Library JAR ==="
          find app/libs -maxdepth 2 -type f 2>/dev/null || true

          echo "=== Library AAR ==="
          find . -type f -name "*.aar" -not -path "*/build/*"

          echo "=== Gradle dependencies ==="
          grep -nE "implementation|api |compileOnly|repositories" \
            app/build.gradle || true


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.13
          fi
          chmod +x gradlew

      
      - name: Build Release APK with R8
        id: build_apk
        continue-on-error: true
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --info

      - name: Check APK Output
        if: always()
        id: check_apk
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          if [ -f "$APK" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "APK ditemukan: $APK"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "APK release tidak ditemukan."
          fi

      - name: Upload Release APK
        if: steps.check_apk.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Released-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Report Build Result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.build_apk.outcome }}" = "success" ] && \
             [ "${{ steps.check_apk.outputs.exists }}" = "true" ]; then
            echo "Build berhasil dan APK tersedia."
          else
            echo "::warning::Build gagal atau APK release tidak tersedia. Periksa log build."
          fi
