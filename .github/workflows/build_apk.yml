name: Build Android APK Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Extract project from ZIP if present
        shell: bash
        run: |
          if [ -f "zerotoolsskin.zip" ]; then
            unzip -o zerotoolsskin.zip -d extracted
            shopt -s dotglob nullglob
            for item in extracted/*; do
              mv "$item" .
            done
            rm -rf extracted zerotoolsskin.zip
          fi

      - name: Auto Fix AndroidManifest References
        shell: bash
        run: |
          MANIFEST_PATH="app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            echo "Memperbaiki Manifest otomatis..."
            # 1. Menghapus atribut package usang di tag manifest
            sed -i 's/package="com.zero.tools.skin"//g' "$MANIFEST_PATH"
            # 2. Mengubah tema DebugActivity yang hilang menjadi AppTheme biasa
            sed -i 's/theme="@style\/AppTheme.DebugActivity"/theme="@style\/AppTheme"/g' "$MANIFEST_PATH"
            # 3. Menghapus duplikasi AdActivity yang bikin merger gagal
            # Menghapus salah satu blok AdActivity jika tertulis ganda di paling bawah
            sed -i '/<activity android:name="com.google.android.gms.ads.AdActivity"/,/.*\/>/d' "$MANIFEST_PATH"
          else
            echo "AndroidManifest.xml tidak ditemukan pada jalur: $MANIFEST_PATH"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Install Android SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.13
          fi
          chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --refresh-dependencies

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Released-APK
          path: app/build/outputs/apk/release/*.apk
