name: Build Android APK Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Tombol untuk menjalankan build secara manual

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew
      # Jika gradlew tidak ada di root, skrip ini tetap akan mencoba membuat atau mencari komponen build

    - name: Build Release APK dengan R8
      run: ./gradlew assembleRelease --no-daemon

    - name: Unggah Hasil APK Aman ke GitHub
      uses: actions/upload-artifact@v4
      with:
        name: ZeroToolsSkin-Secure-APK
        path: app/build/outputs/apk/release/*.apk
        retention-days: 7
